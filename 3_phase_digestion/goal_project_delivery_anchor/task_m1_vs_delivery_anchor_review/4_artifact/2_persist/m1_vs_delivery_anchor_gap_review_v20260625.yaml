overall_classification: deterministic kernel/substrate
classification_reason: M1 evidences an installable pxfquery v0.1.0 package with deterministic
  forward and reverse fixture demos, CLI wiring, and structured deterministic errors.
  It does not evidence resolver-mediated entry, LLM parse/summary, proxy routing,
  transfer/suggestion semantics, full T-064 route metadata, or T-021 standard-resource
  compatibility. Therefore it should be treated as a deterministic kernel/substrate,
  not a complete anchored algorithm package.
