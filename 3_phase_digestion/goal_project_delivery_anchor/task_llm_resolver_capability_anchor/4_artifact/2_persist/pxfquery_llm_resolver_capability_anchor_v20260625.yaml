ai_service_requirement:
  required_when: milestone_claims_llm_assisted_resolver_behavior
  configured_route: CyHex-registered AI address
  desired_model_route: deepseek-v4-pro
  route_change_rule: >
    Any replacement model, provider, or direct non-CyHex route must be explicitly
    approved by a later task or user decision before it can satisfy LLM resolver
    acceptance.
  minimum_future_evidence:
    - backend_route_configuration_showing_CyHex_registered_AI_address
    - requested_model_or_approved_successor_route
    - resolver_parse_or_summary_call_evidence
    - structured_output_or_user_summary_result
    - latency_failure_and_fallback_metadata
  disallowed_substitutes:
    - endpoint_connectivity_only
    - static_example_prompt_without_resolver_dispatch
    - deterministic_parser_counted_as_LLM_delivery_without_user_approved_fallback_only_scope
    - LLM_generated_biological_claim_without_matrix_or_index_evidence
resolver_delivery_definition:
  m3_primary_paths:
    - natural_language_entry_to_parse_to_dispatch_to_query_result
    - semi_structured_entry_to_normalization_to_dispatch_to_query_result
    - exact_first_evidence_routing
    - proxy_routing_after_exact_miss_or_low_coverage_when_allowed
    - controlled_not_found_or_no_hit_when evidence is absent or confidence is too low
    - LLM_assisted_parse_normalize_or_summary_through_configured_route_when_claimed
  minimum_user_visible_behavior:
    - accepts_forward_query_with_biological_context_and_perturbation
    - accepts_reverse_query_with_biological_context_and_desired_function
    - reports parsed intent and normalized entities
    - asks_for_or_records_ambiguity_when required fields are missing or conflicting
    - returns ranked functional programs or ranked perturbation candidates when evidence is found
    - returns no-hit or unsupported status without false-positive substitution
    - exposes evidence metadata alongside any natural-language summary
  semi_structured_supported_fields:
    - mode
    - perturbation
    - perturbation_type
    - biological_context
    - function_target
    - desired_direction
    - data_source_or_modality
    - proxy_allowed
    - summary_requested
  required_structured_parse_fields:
