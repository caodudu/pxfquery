    - raw_input
    - entry_type
    - intent
    - mode
    - perturbation_raw
    - perturbation_normalized
    - perturbation_type
    - biological_context_raw
    - biological_context_normalized
    - function_target_raw
    - function_target_normalized
    - desired_direction
    - data_source_or_modality
    - missing_required_fields
    - ambiguity_flags
    - parse_confidence
    - parse_method
    - ai_route_used
    - fallback_used
  required_result_metadata:
    - query_id
    - route_status
    - evidence_level
    - exact_match_attempted
    - exact_match_status
    - proxy_attempted
    - proxy_basis
    - proxy_similarity_or_hierarchy
    - not_found_reason
    - source_index_or_matrix_reference
    - normalized_entity_ids_or_labels
    - warnings
    - limitations
    - fallback_trigger
    - llm_model_route
    - deterministic_components_used
    - timestamp_or_run_id
routing_semantics:
  exact:
    definition: >
      Exact perturbation, function, and biological-context matches must be tried
      before proxy routes and labeled as exact in result metadata.
    applies_to:
      - forward
      - reverse
    required_metadata:
      - exact_match_status
      - source_index_or_matrix_reference
      - matched_entity_labels
      - evidence_level: EXACT
    llm_allowed_roles:
      - parse_user_text
      - normalize_candidate_names
      - summarize_exact_evidence
    llm_forbidden_roles:
      - fabricate_matrix_rows
      - convert_uncertain_alias_to_found_without_threshold
      - hide_missing_context_or_function_mapping
  proxy:
    definition: >
      Proxy routing may be used only after exact miss, low coverage, or explicit
      proxy request, and must report the source and limitation of the proxy basis.
    allowed_proxy_bases:
      - cell_line_hierarchy_or_neighbors
      - disease_lineage_or_subtype_context
      - gene_neighbors
      - drug_neighbors
      - function_aliases_or_approved_function_index_mapping
    evidence_levels:
      - PROXY_PERT
      - PROXY_CELL
      - PROXY_BOTH
      - approved_function_alias_proxy
    required_metadata:
      - exact_miss_or_low_coverage_trigger
      - proxy_candidate_source
      - proxy_similarity_or_hierarchy_basis
      - proxy_confidence
      - proxy_limitations
    disallowed:
      - nearest_string_match_reported_as_found_without_threshold
      - proxy_returned_as_exact
      - LLM_suggested_proxy_without_index_or_metadata_basis
  not_found:
    definition: >
      Unsupported or low-confidence inputs must produce controlled no-hit or
      not-found states rather than crashes or invented substitutions.
    applies_to:
      - unsupported_perturbation
      - unsupported_cell_line_or_context
      - unsupported_function
      - missing_index
      - low_confidence_ambiguity
      - proxy_route_below_threshold
    required_metadata:
      - route_status: NOT_FOUND
      - not_found_reason
      - attempted_exact_and_proxy_routes
      - no_false_positive_substitution_confirmation
    allowed_user_output:
      - concise_no_hit_summary
      - clearly_labeled_suggestions_below_acceptance_threshold
fallback_semantics:
  principle: >
    Fallback is runtime behavior and review evidence. It is not proof that the
    primary LLM, resolver, or proxy path was delivered unless the milestone
    explicitly accepts fallback-only scope with user approval.
  fallback_cases:
    - trigger: llm_service_unavailable
      expected_behavior: use deterministic parser or request structured fields
      classification_without_primary_path_evidence: partial_or_blocked
    - trigger: llm_parse_failure
      expected_behavior: return parse failure with missing/ambiguous fields and no query dispatch unless safe
      classification_without_primary_path_evidence: partial_or_failed_if_false_positive
    - trigger: proxy_failure
      expected_behavior: return exact-only no-hit or evidence-insufficient status with proxy failure metadata
      classification_without_primary_path_evidence: blocked_when_proxy_required
    - trigger: missing_indexes
      expected_behavior: controlled blocked status naming missing index assets
      classification_without_primary_path_evidence: blocked
    - trigger: unsupported_cell_line
      expected_behavior: try approved context proxy if allowed, otherwise not-found
      classification_without_primary_path_evidence: not_delivered_for_context_proxy
    - trigger: unsupported_perturbation
      expected_behavior: no-hit unless approved synonym or neighbor route crosses threshold
      classification_without_primary_path_evidence: failed_if_false_positive
    - trigger: unsupported_function
      expected_behavior: no-hit or blocked if function index is required but unavailable
      classification_without_primary_path_evidence: blocked_or_not_found
    - trigger: low_confidence_match
      expected_behavior: expose ambiguity and do not dispatch as found without user confirmation or threshold pass
      classification_without_primary_path_evidence: partial_or_failed_if_silent
downgrade_rules:
  inherits_from: T-062 pxfquery_algorithm_downgrade_rules_v20260625
  explicit_user_approval_required_for:
    - replacing_resolver_entry_with_direct_function_calls
    - replacing_LLM_required_behavior_with_deterministic_parser_only
    - accepting_endpoint_connectivity_as_full_LLM_resolver_delivery
    - replacing_proxy_with_exact_only_lookup_when_proxy_is_required
    - accepting_fallback_only_as_primary_delivery
    - hiding_not_found_or_low_confidence_cases
    - deferring_evidence_metadata
  labels_for_unapproved_scope_reduction:
    - downgraded
    - deferred-not-approved
acceptance_status_vocabulary:
