  - This task is an OPTIONAL hybrid layer; failure of any example does not block the deterministic forward/reverse milestone.
  - All Python execution must use the pxfquery conda environment: `/Users/dudu/Softwares/miniconda/bin/conda run -n pxfquery python ...`.
  - The hybrid resolver integrates T-027 query indexes, T-028 function index, T-031 no-hit guard, and T-032 reverse stability semantics; it does NOT replace any of these upstream deliverables.
  - All upstream assets are read-only. If a bug must be repaired, it is recorded as a pxfquery-T-033 local repair in `5_report/repair_log.md`.
  - Build the hybrid resolver on top of the existing QueryResolver / ForwardQuery / ReverseQuery API surface from T-024 workspace; do not duplicate the index loading code wholesale.
  - The not-found example must be explicit NOT_FOUND, not a fuzzy false-positive fallthrough.
