notes:
  - The 91 function terms originate from the `var_names` of cp_func_ad.h5ad, sh_func_ad.h5ad, xpr_func_ad.h5ad in the T-021/D-004 bundle. T-028 must derive them via the T-026 loader (A-001) at runtime, never hard-code them.
  - The upstream function_index.json is read through the T-027 runtime query index pack (A-004) symlink. When it is missing or partial (as T-013 evidence indicates), T-028 produces a corrected local version under 4_artifact/2_persist/pxfquery_T028_function_index/.
  - All loads are by reference to T-021 bundle; no byte-level copying of upstream files into T-028.
  - T-023 is intentionally out of scope for this v1 task.
  - Validation must open H5AD files and JSON via Python. File-existence checks alone are insufficient.