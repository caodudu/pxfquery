[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pxfquery-T-040"
version = "0.1.0"
description = "PxFquery package-core milestone assembled from T-024/T-026/T-029/T-031"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["bioinformatics", "LINCS", "perturbation", "GSEA", "functional-genomics"]

dependencies = [
    "anndata>=0.10",
    "numpy>=1.24",
    "pandas>=2.0",
    "plotly>=5.0",
    "matplotlib>=3.7",
    "openai>=1.0",
]

[project.optional-dependencies]
dev = [
    "jupyter",
    "ipykernel",
    "pytest",
]
streamlit = [
    "streamlit>=1.30",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["pxfquery*"]
