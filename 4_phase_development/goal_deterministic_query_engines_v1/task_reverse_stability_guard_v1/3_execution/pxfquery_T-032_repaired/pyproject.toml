[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pxfquery-T-032"
version = "0.1.0"
description = "PxFquery with reverse-query numerical stability guard (pxfquery-T-032, reverse_stability_guard_v1)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["bioinformatics", "LINCS", "perturbation", "GSEA", "functional-genomics", "stability-guard"]

dependencies = [
    "anndata>=0.10",
    "numpy>=1.24",
    "pandas>=2.0",
    "plotly>=5.0",
    "matplotlib>=3.7",
    "openai>=1.0",
]

[project.optional-dependencies]
dev = [
    "jupyter",
    "ipykernel",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["pxfquery*"]
