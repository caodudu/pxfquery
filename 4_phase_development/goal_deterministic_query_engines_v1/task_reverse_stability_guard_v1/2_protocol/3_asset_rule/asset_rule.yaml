notes:
  - Guard semantics must NOT corrupt normal ranking: for any row with non-zero norm and a non-zero target, similarity must be the original cosine value within floating-point tolerance.
  - Abnormal cases that the guard must catch explicitly: zero-norm row in matrix, zero-norm target vector, NaN or Inf in row, all-zero matrix slice (no usable rows), term that fails fuzzy match, division-by-zero in cosine denominator.
  - "Guard flag" pattern: each guarded event emits a warning with (severity, scenario, message, offending_index). Warnings are aggregated on the ReverseResult and serialized as `pxfquery_T-032_guard_warnings.json`. The execution script asserts that every abnormal scenario produced at least one guard warning and that all top-K similarities of the positive control are finite within [-1.0, 1.0].
  - Load matrices by reference through the T-024 workspace DataLoader / PxFquery; do not copy upstream matrix bytes.
  - Do not hard-code matrix shapes, column names, or term names from planning notes — discover them at runtime.
  - Repair scope is T-032 local: if T-024 has a zero-norm / abnormal-similarity bug, fix it in 3_execution/pxfquery_T-032_repaired/, register a corrected `pxfquery-T-032` workspace, and document lineage back to T-024.
  - The repaired `pxfquery-T-032` workspace must also be installed as editable into the pxfquery conda env (`pip install -e .`) before running the stability demo and positive control.
  - All Python execution must run inside the project default conda environment: `/Users/dudu/Softwares/miniconda/bin/conda run -n pxfquery python ...`.
