notes:
  - The guard targets only CAP-05 (fuzzy false-positive on unsupported perturbations). It is NOT responsible for resolver, NL layer, function_index, or index naming issues.
  - The guard must not break the deterministic forward query path: known perturbations must still return found=True.
  - The guard must be importable as a Python module and runnable from the pxfquery conda environment.
  - If ForwardQuery's fuzzy-match code structurally blocks patching, repair it locally in this task and document.
  - All upstream artifacts are read-only; corrections are local pxfquery-T-031 versions.